<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bhatti's AI Tools</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg-color: #020617;
        --bg-panel: #0f172a;
        --bg-card: rgba(15, 23, 42, 0.6);
        
        --text-main: #f8fafc;
        --text-muted: #94a3b8;
        
        --color-cyan: #00f3ff;
        --color-pink: #ff00ff;
        --color-green: #10b981;
        --color-red: #ef4444;
        --color-gold: #ffd700;
        
        --border-light: rgba(255, 255, 255, 0.1);
        --border-active: rgba(0, 243, 255, 0.5);
        
        --shadow-glow: 0 0 20px rgba(0, 243, 255, 0.2);
        --shadow-card: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        
        --font-sans: 'Inter', sans-serif;
        --font-display: 'Outfit', sans-serif;
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }
      
      body {
        background-color: var(--bg-color);
        color: var(--text-main);
        font-family: var(--font-sans);
        overflow-x: hidden;
      }

      /* Utilities */
      .w-full { width: 100%; }
      .h-full { height: 100%; }
      .flex { display: flex; }
      .flex-col { flex-direction: column; }
      .items-center { align-items: center; }
      .justify-center { justify-content: center; }
      .justify-between { justify-content: space-between; }
      .gap-2 { gap: 0.5rem; }
      .gap-4 { gap: 1rem; }
      .gap-6 { gap: 1.5rem; }
      .gap-8 { gap: 2rem; }
      .text-center { text-align: center; }
      .relative { position: relative; }
      .absolute { position: absolute; }
      .hidden { display: none; }
      .cursor-pointer { cursor: pointer; }
      
      /* Typography */
      h1, h2, h3 { font-family: var(--font-display); }
      .text-neon { color: var(--color-cyan); text-shadow: 0 0 10px rgba(0, 243, 255, 0.5); }
      .text-pink { color: var(--color-pink); text-shadow: 0 0 10px rgba(255, 0, 255, 0.5); }
      .text-muted { color: var(--text-muted); }
      .font-bold { font-weight: 700; }
      .uppercase { text-transform: uppercase; }
      .text-sm { font-size: 0.875rem; }
      .text-xs { font-size: 0.75rem; }

      /* Components */
      .btn {
        padding: 0.75rem 1.5rem;
        border-radius: 0.75rem;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.3s;
        border: none;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
      }
      .btn-primary {
        background: var(--color-cyan);
        color: #000;
        box-shadow: var(--shadow-glow);
      }
      .btn-primary:hover { background: #00c2cc; transform: translateY(-2px); }
      .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
      
      .btn-secondary {
        background: transparent;
        border: 1px solid var(--border-light);
        color: var(--text-main);
      }
      .btn-secondary:hover { background: rgba(255,255,255,0.05); border-color: var(--color-cyan); }

      .input-field {
        width: 100%;
        background: rgba(15, 23, 42, 0.5);
        border: 1px solid var(--border-light);
        border-radius: 0.5rem;
        padding: 0.75rem 1rem;
        color: white;
        outline: none;
        transition: border-color 0.3s;
      }
      .input-field:focus { border-color: var(--color-cyan); box-shadow: 0 0 10px rgba(0,243,255,0.1); }

      .card {
        background: var(--bg-card);
        backdrop-filter: blur(10px);
        border: 1px solid var(--border-light);
        border-radius: 1rem;
        padding: 1.5rem;
        box-shadow: var(--shadow-card);
      }

      /* Navigation */
      .navbar {
        height: 5rem;
        position: sticky;
        top: 0;
        z-index: 50;
        background: rgba(2, 6, 23, 0.8);
        backdrop-filter: blur(12px);
        border-bottom: 1px solid var(--border-light);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 2rem;
      }
      .nav-tabs {
        display: flex;
        background: var(--bg-panel);
        padding: 0.25rem;
        border-radius: 99px;
        border: 1px solid var(--border-light);
        overflow-x: auto;
      }
      .nav-item {
        padding: 0.5rem 1.25rem;
        border-radius: 99px;
        font-size: 0.875rem;
        font-weight: 500;
        color: var(--text-muted);
        cursor: pointer;
        border: none;
        background: transparent;
        display: flex;
        align-items: center;
        gap: 0.5rem;
        transition: all 0.3s;
        white-space: nowrap;
      }
      .nav-item.active { background: var(--color-cyan); color: #000; box-shadow: var(--shadow-glow); }
      .nav-item:hover:not(.active) { color: white; }

      /* Tool Grid */
      .grid-tools { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 1.5rem; }
      
      .tool-card {
        background: rgba(15, 23, 42, 0.6);
        border: 1px solid var(--border-light);
        border-radius: 1rem;
        padding: 1.5rem;
        cursor: pointer;
        transition: all 0.3s;
        position: relative;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }
      .tool-card:hover { transform: translateY(-5px); border-color: var(--color-cyan); box-shadow: var(--shadow-glow); }
      .tool-icon {
        width: 3.5rem;
        height: 3.5rem;
        border-radius: 0.75rem;
        background: #020617;
        border: 1px solid rgba(0,243,255,0.2);
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.3s;
      }
      .tool-card:hover .tool-icon { background: var(--color-cyan); border-color: var(--color-cyan); }
      .tool-card:hover .tool-icon svg { color: black; transform: scale(1.1); }

      /* Upload Zone */
      .upload-box {
        border: 2px dashed var(--border-light);
        border-radius: 1.5rem;
        padding: 3rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        cursor: pointer;
        transition: all 0.3s;
        background: rgba(255,255,255,0.02);
      }
      .upload-box:hover { border-color: var(--color-cyan); background: rgba(0,243,255,0.05); }

      /* Animations */
      @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
      @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes popIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
      @keyframes pulse { 50% { opacity: 0.5; } }
      @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      @keyframes shimmer { 100% { transform: translateX(100%); } }

      .animate-fade-in { animation: fadeIn 0.6s ease-out forwards; }
      .animate-slide-up { animation: slideUp 0.6s ease-out forwards; }
      .animate-pop-in { animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
      .animate-pulse { animation: pulse 2s infinite; }
      .animate-spin { animation: spin 1s linear infinite; }

      /* Custom Scrollbar */
      ::-webkit-scrollbar { width: 8px; }
      ::-webkit-scrollbar-track { background: #020617; }
      ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
      ::-webkit-scrollbar-thumb:hover { background: #334155; }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/client": "https://esm.sh/react-dom@^19.2.3/client",
    "lucide-react": "https://esm.sh/lucide-react@^0.560.0",
    "@google/genai": "https://esm.sh/@google/genai@^1.33.0",
    "pdf-lib": "https://esm.sh/pdf-lib@1.17.1",
    "jszip": "https://esm.sh/jszip@3.10.1",
    "pdfjs-dist": "https://esm.sh/pdfjs-dist@3.11.174",
    "mammoth": "https://esm.sh/mammoth@1.6.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
  </body>
</html>
