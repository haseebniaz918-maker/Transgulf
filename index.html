<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bhatti's AI Tools</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              slate: {
                800: '#1e293b',
                900: '#0f172a',
                950: '#020617',
              },
              cyan: {
                DEFAULT: '#00f3ff',
                400: '#00f3ff',
                500: '#00c2cc',
              },
              pink: {
                DEFAULT: '#ff00ff',
                400: '#ff00ff',
              },
              gold: {
                DEFAULT: '#ffd700',
              },
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              display: ['Outfit', 'sans-serif'],
            },
            animation: {
              'fade-in': 'fadeIn 0.6s ease-out forwards',
              'slide-up': 'slideUp 0.6s ease-out forwards',
              'pop-in': 'popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards',
              'pulse-slow': 'pulse 3s infinite',
              'spin-slow': 'spin 3s linear infinite',
              'magic-scan': 'magicScan 2s linear infinite',
              'neon-pulse': 'neonPulse 2s infinite',
              'writing': 'writing 2s ease-in-out infinite',
              'erasing': 'erasing 2s ease-in-out infinite',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
              slideUp: {
                '0%': { opacity: '0', transform: 'translateY(20px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              popIn: {
                '0%': { opacity: '0', transform: 'scale(0.9)' },
                '100%': { opacity: '1', transform: 'scale(1)' },
              },
              magicScan: {
                '0%': { top: '-10%', opacity: '0' },
                '10%': { opacity: '1' },
                '90%': { opacity: '1' },
                '100%': { top: '110%', opacity: '0' },
              },
              neonPulse: {
                '0%, 100%': { boxShadow: '0 0 10px rgba(0, 243, 255, 0.5)' },
                '50%': { boxShadow: '0 0 20px rgba(0, 243, 255, 0.9)' },
              },
              writing: {
                '0%': { transform: 'translateX(0) rotate(0deg)' },
                '25%': { transform: 'translateX(20px) rotate(5deg)' },
                '50%': { transform: 'translateX(0) rotate(0deg)' },
                '75%': { transform: 'translateX(15px) rotate(-5deg)' },
                '100%': { transform: 'translateX(0) rotate(0deg)' },
              }
            },
            boxShadow: {
              'neon': '0 0 20px rgba(0, 243, 255, 0.2)',
              'neon-pink': '0 0 20px rgba(255, 0, 255, 0.2)',
              'neon-strong': '0 0 30px rgba(0, 243, 255, 0.6)',
            }
          },
        },
      }
    </script>
    <style>
      /* Scrollbar utilities that are harder to do with pure tailwind config */
      ::-webkit-scrollbar { width: 8px; }
      ::-webkit-scrollbar-track { background: #020617; }
      ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
      ::-webkit-scrollbar-thumb:hover { background: #334155; }
      .glass-card {
        background: rgba(15, 23, 42, 0.6);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/client": "https://esm.sh/react-dom@^19.2.3/client",
    "lucide-react": "https://esm.sh/lucide-react@^0.560.0",
    "@google/genai": "https://esm.sh/@google/genai@^1.33.0",
    "pdf-lib": "https://esm.sh/pdf-lib@1.17.1",
    "jszip": "https://esm.sh/jszip@3.10.1",
    "pdfjs-dist": "https://esm.sh/pdfjs-dist@3.11.174",
    "mammoth": "https://esm.sh/mammoth@1.6.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/"
  }
}
</script>
</head>
  <body class="bg-slate-950 text-slate-200">
    <div id="root"></div>
  </body>
</html>
