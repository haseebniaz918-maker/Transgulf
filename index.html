
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bhatti's AI Tools</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              primary: 'var(--primary-color)',
              secondary: 'var(--secondary-color)',
              'theme-bg': 'var(--bg-color)',
              'theme-text': 'var(--text-color)',
              slate: {
                800: '#1e293b',
                900: '#0f172a',
                950: '#020617',
              },
              pink: {
                50: '#fff1f2',
                100: '#ffe4e6',
                400: '#fb7185',
                500: '#f43f5e',
                600: '#e11d48',
                DEFAULT: '#ff007f',
              },
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              display: ['Outfit', 'sans-serif'],
            },
            animation: {
              'fade-in': 'fadeIn 0.6s ease-out forwards',
              'slide-up': 'slideUp 0.6s ease-out forwards',
              'pop-in': 'popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards',
              'pulse-slow': 'pulse 3s infinite',
              'glow': 'glow 2s ease-in-out infinite',
              'bounce-subtle': 'bounceSubtle 2s ease-in-out infinite',
            },
            keyframes: {
              fadeIn: { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
              slideUp: { '0%': { opacity: '0', transform: 'translateY(30px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } },
              popIn: { '0%': { opacity: '0', transform: 'scale(0.8)' }, '100%': { opacity: '1', transform: 'scale(1)' } },
              glow: { '0%, 100%': { opacity: '0.8', filter: 'brightness(1)' }, '50%': { opacity: '1', filter: 'brightness(1.5)' } },
              bounceSubtle: { '0%, 100%': { transform: 'translateY(0)' }, '50%': { transform: 'translateY(-5px)' } }
            }
          },
        },
      }
    </script>
    <style>
      :root {
        --primary-color: #ff007f; /* Vibrant Pink */
        --secondary-color: #ff4da6;
        --bg-color: #020617;
        --text-color: #f1f5f9;
      }
      
      body {
        background: var(--bg-color);
        color: var(--text-color);
        transition: background 0.5s ease, color 0.5s ease;
        overflow-x: hidden;
      }

      .glass-card {
        background: rgba(15, 23, 42, 0.6);
        backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 0, 127, 0.1);
      }
      
      .shadow-neon-pink {
        box-shadow: 0 0 20px rgba(255, 0, 127, 0.4);
      }
      
      .shadow-neon-pink-strong {
        box-shadow: 0 0 35px rgba(255, 0, 127, 0.6);
      }

      .light-theme {
        --primary-color: #e11d48;
        --bg-color: #fff1f2;
        --text-color: #4c0519;
      }

      .light-theme .glass-card {
        background: rgba(255, 255, 255, 0.7);
        border: 1px solid rgba(225, 29, 72, 0.1);
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/client": "https://esm.sh/react-dom@^19.2.3/client",
    "lucide-react": "https://esm.sh/lucide-react@^0.560.0",
    "@google/genai": "https://esm.sh/@google/genai@^1.33.0",
    "pdf-lib": "https://esm.sh/pdf-lib@1.17.1",
    "jszip": "https://esm.sh/jszip@3.10.1",
    "pdfjs-dist": "https://esm.sh/pdfjs-dist@3.11.174",
    "mammoth": "https://esm.sh/mammoth@1.6.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/"
  }
}
</script>
</head>
  <body class="dark">
    <div id="root"></div>
  </body>
</html>
